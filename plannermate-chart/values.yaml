# Default values - override these per environment
R_DOCKERHUB_USERNAME: viktoralexiev
replicaCount: 1

image:
  repository: viktoralexiev/planmate
  tag: v2
  pullPolicy: Always

service:
  type: NodePort
  port: 8081
  nodePort: 30081

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

env:
  SPRING_PROFILES_ACTIVE: prod
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/planmate"
  SPRING_DATASOURCE_USERNAME: "planmate"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  SERVER_PORT: "8081"

postgres:
  image:
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  db: planmate
  storage: 1Gi
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"

iam:
  replicaCount: 1
  image:
    repository: viktorsirakov08/iam-plannermate
    tag: v1
    pullPolicy: IfNotPresent
  service:
    port: 8085
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"