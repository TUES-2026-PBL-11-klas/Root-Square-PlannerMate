replicaCount: 1
image:
  repository: viktorsirakov08/planner-ai
  tag: v1
  pullPolicy: IfNotPresent
service:
  port: 8082
env:
  GROQ_MODEL: "llama-3.3-70b-versatile"
  GROQ_MAX_TOKENS: "1024"
resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8082
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 6
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8082
  initialDelaySeconds: 60
  periodSeconds: 20
  failureThreshold: 3
