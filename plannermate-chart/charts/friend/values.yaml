replicaCount: 1
image:
  repository: viktorsirakov08/friends-service
  tag: v1
  pullPolicy: IfNotPresent
service:
  port: 8090
env:
  JWT_SECRET: "change-this-development-jwt-secret-to-a-long-production-secret"
  IAM_SERVICE_BASE_URL: "http://planmate-iam:8085"
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "250m"
readinessProbe:
  tcpSocket:
    port: 8090
  initialDelaySeconds: 70
  periodSeconds: 10
  failureThreshold: 6
livenessProbe:
  tcpSocket:
    port: 8090
  initialDelaySeconds: 120
  periodSeconds: 20
  failureThreshold: 3
