replicaCount: 1
image:
  repository: viktorsirakov08/iam-plannermate
  tag: v2
  pullPolicy: IfNotPresent
service:
  port: 8085
env:
  JWT_SECRET: "change-this-development-jwt-secret-to-a-long-production-secret"
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "250m"
readinessProbe:
  tcpSocket:
    port: 8085
  initialDelaySeconds: 70
  periodSeconds: 10
  failureThreshold: 6
livenessProbe:
  tcpSocket:
    port: 8085
  initialDelaySeconds: 120
  periodSeconds: 20
  failureThreshold: 3
