spring.application.name=friend-service

# * Run on a different port from the IAM service (8080)
server.port=8090

# * DATABASE — its own schema in the same or a different PostgreSQL instance
spring.datasource.url=jdbc:postgresql://localhost:5432/friend_system
spring.datasource.username=postgres
# ! SECURITY: Move to environment variable in production
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# * JPA
# ! TODO: Change to 'validate' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# * JWT — must match the secret in the IAM service exactly
# ! SECURITY: Move to environment variable or Vault in production
jwt.secret=your-very-secure-and-very-long-secret-key-here-12345

# * IAM service base URL — used by the IamClient to verify users exist
iam.service.base-url=http://localhost:8085

logging.level.org.springframework.security=DEBUG