name: CI - Friend Service

on:
  push:
    branches: [after-end-date]
    paths:
      - 'friend-service/**'
      - '.github/workflows/deploy-friend.yaml'
  pull_request:
    branches: [after-end-date]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test --no-transfer-progress
        working-directory: friend-service