name: Deploy Friend Service

on:
  push:
    branches: [scheduler]
    paths:
      - 'friend-service/**'
      - '.github/workflows/deploy-friend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test --no-transfer-progress
        working-directory: friend-service

      - name: Trigger Render deploy
        if: success()
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRIEND }}"