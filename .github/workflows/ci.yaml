name: CI - Build and Push Docker Image

# Trigger on every push to main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 for building the Spring Boot app
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven     # Cache Maven deps so builds are faster after the first one

      # Step 3: Run tests - never skip tests in CI
      - name: Run tests
        run: mvn test
        working-directory: scheduler

      # Step 4: Set up Docker Buildx - needed for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Log in to Docker Hub using our secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6: Build and push the image
      # We tag with both 'latest' and the git commit SHA
      # The SHA tag means you can always roll back to any exact commit
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}  # Only push on push to main, not PRs
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/planmate:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/planmate:${{ github.sha }}
          cache-from: type=gha    # Use GitHub Actions cache for faster builds
          cache-to: type=gha,mode=max

      # Step 7: Update the Helm values.yaml with the new image tag
      # This is what triggers ArgoCD to deploy the new version
      - name: Update image tag in Helm values
        if: github.event_name == 'push'
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/" helm/planmate/values.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add helm/planmate/values.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}"
          git push