name: CI - Java services

on:
  push:
    branches: [after-end-date]
    paths:
      - 'aiapi/**'
      - 'friend-service/**'
      - 'scheduler/**'
      - 'plannermate-chart/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [after-end-date]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [aiapi, friend-service, scheduler]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests for ${{ matrix.module }}
        run: mvn test --no-transfer-progress
        working-directory: ${{ matrix.module }}

      - name: Install Helm
        if: matrix.module == 'scheduler'
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        if: matrix.module == 'scheduler'
        run: helm lint plannermate-chart