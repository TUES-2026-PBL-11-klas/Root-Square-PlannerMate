spring.application.name=scheduler
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.show-details=always

# Push metrics to Grafana Cloud via OTLP
management.otlp.metrics.export.url=${GRAFANA_OTLP_URL}
management.otlp.metrics.export.headers.authorization=Basic ${GRAFANA_AUTH}
management.otlp.metrics.export.step=30s
management.metrics.tags.application=planmate-scheduler
management.metrics.tags.environment=production