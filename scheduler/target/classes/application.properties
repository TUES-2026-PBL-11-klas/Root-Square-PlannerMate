spring.application.name=scheduler
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:schedulerdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

iam.service.base-url=${IAM_SERVICE_BASE_URL:http://localhost:8085}
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.show-details=always
